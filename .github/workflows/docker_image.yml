name: Build Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The version tag must be computed once and shared. If each matrix job stamped its
  # own timestamp the per-arch builds would carry different tags and the manifest
  # merge would have nothing consistent to point at.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.build_date.outputs.date }}
    steps:
      # Version tag is {branch}-{short sha}-{utc timestamp}, e.g.
      # master-a1b2c3d-20260817134500. Docker tags allow [a-zA-Z0-9_][a-zA-Z0-9._-]*
      # only, so the branch is sanitised: workflow_dispatch can run on a ref like
      # "feature/foo", and the "/" would otherwise be read as a registry path
      # separator. The timestamp is deliberately colon-free for the same reason,
      # so it cannot reuse the ISO-8601 BUILD_DATE below.
      # ref_name goes through env, not direct ${{ }} interpolation, so a branch
      # name cannot inject shell.
      - name: Compute version tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9_.-' '-')
          echo "tag=${branch}-${GITHUB_SHA::7}-$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Compute build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # Each architecture builds natively on its own runner. Cython build_ext under QEMU
  # emulation risks the 6h job limit, and native arm64 runners are free for public
  # repositories, so there is no reason to emulate. Each job pushes an untagged
  # manifest by digest; the merge job assembles them into one multi-arch tag.
  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare platform name
        id: plat
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      # The builder stage (conda env + Cython artifacts) plus the release image
      # exceeds the ~14GB free on a stock runner. Reclaim ~20GB first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache is scoped per platform so the amd64 and arm64 conda/Cython layers do
      # not evict each other.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.plat.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.plat.outputs.pair }}
          build-args: |
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.version.outputs.date }}

      # Importing a Cython module proves the extensions actually compiled for this
      # architecture. The discovery assertion is the one that matters for the fork:
      # it fails if the Bitkub connector landed anywhere the client does not scan,
      # which a plain import would not catch. Run against the pushed digest, so what
      # is tested is exactly what was published, and natively, since the runner
      # architecture matches the image.
      - name: Smoke test pushed digest
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$REF" python -c "
          import hummingbot.core.clock
          import hummingbot.strategy.pure_market_making.pure_market_making
          from hummingbot.client.settings import AllConnectorSettings
          settings = AllConnectorSettings.get_connector_settings()
          assert 'bitkub' in settings, sorted(settings)
          print('smoke test ok:', settings['bitkub'].name, settings['bitkub'].type)
          "

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.plat.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-architecture digests into a single multi-arch manifest and
  # applies the tags. Nothing is tagged before this point, so a failed architecture
  # never reaches a published tag.
  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          VERSION_TAG: ${{ needs.version.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION_TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect published tag
        env:
          VERSION_TAG: ${{ needs.version.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}"
