name: Build Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Fast path, runs on every push to master. Layers this fork's Bitkub connector
  # onto the matching released upstream image rather than compiling from source.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Derived from hummingbot/VERSION rather than hardcoded, so syncing upstream
      # moves the base along with the source tree. If upstream has not published the
      # tag yet the build fails on "manifest unknown", which is the correct outcome.
      - name: Resolve base image tag
        id: base
        run: echo "tag=version-$(cat hummingbot/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Version tag is {branch}-{short sha}-{utc timestamp}, e.g.
      # master-a1b2c3d-20260817134500. Docker tags allow [a-zA-Z0-9_][a-zA-Z0-9._-]*
      # only, so the branch is sanitised: workflow_dispatch can run on a ref like
      # "feature/foo", and the "/" would otherwise be read as a registry path
      # separator. The timestamp is deliberately colon-free for the same reason,
      # so it cannot reuse the ISO-8601 BUILD_DATE above.
      # ref_name goes through env, not direct ${{ }} interpolation, so a branch
      # name cannot inject shell.
      - name: Compute version tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9_.-' '-')
          echo "tag=${branch}-${GITHUB_SHA::7}-$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}

      # Built amd64-only and loaded locally so the smoke test can run it. `load`
      # cannot be combined with a multi-platform build, hence the separate push
      # step below; the overlay is a single small layer so building twice is cheap.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bitkub
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:test
          build-args: |
            BASE_TAG=${{ steps.base.outputs.tag }}
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}

      # Importing a Cython module proves the base image itself is sound. The
      # discovery assertion is the one that matters for the overlay: it fails if the
      # connector landed anywhere the client does not scan, which a plain import
      # would not catch.
      - name: Smoke test image
        run: |
          docker run --rm "${IMAGE}:test" python -c "
          import hummingbot.core.clock
          from hummingbot.client.settings import AllConnectorSettings
          settings = AllConnectorSettings.get_connector_settings()
          assert 'bitkub' in settings, sorted(settings)
          print('smoke test ok:', settings['bitkub'].name, settings['bitkub'].type)
          "

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bitkub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_TAG=${{ steps.base.outputs.tag }}
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}

  # Slow path, manual only. The overlay image ignores every file outside the Bitkub
  # connector, so nothing else would catch a fork-wide change that fails to compile.
  # Run this after syncing upstream, or after touching anything beyond the connector.
  # Validation only: it does not publish.
  build_from_source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The builder stage (conda env + Cython artifacts) plus the release image
      # exceeds the ~14GB free on a stock runner. Reclaim ~20GB first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 only: emulating the Cython build_ext under QEMU for arm64 risks
      # exceeding the 6h job limit.
      - name: Build from source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: hummingbot-from-source:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm hummingbot-from-source:test python -c "
          import hummingbot.core.clock
          from hummingbot.client.settings import AllConnectorSettings
          settings = AllConnectorSettings.get_connector_settings()
          assert 'bitkub' in settings, sorted(settings)
          print('smoke test ok:', settings['bitkub'].name, settings['bitkub'].type)
          "
