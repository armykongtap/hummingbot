name: Bitkub Lint

# Runs the repo's own pre-commit hooks, so results match what upstream's CI would
# say if this connector were submitted there. Only the flake8 and isort hooks are
# invoked: the rest of .pre-commit-config.yaml targets file types this connector
# does not contain, and skipping them avoids bootstrapping the eslint node
# environment on every run.

on:
  push:
    paths:
      - 'hummingbot/connector/exchange/bitkub/**'
      - 'test/hummingbot/connector/exchange/bitkub/**'
      - '.github/workflows/bitkub_lint.yml'
  pull_request:
    paths:
      - 'hummingbot/connector/exchange/bitkub/**'
      - 'test/hummingbot/connector/exchange/bitkub/**'
      - '.github/workflows/bitkub_lint.yml'
  workflow_dispatch:

concurrency:
  group: bitkub-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: flake8 + isort
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Collect Bitkub files
        id: files
        run: |
          {
            echo "list<<EOF"
            git ls-files \
              'hummingbot/connector/exchange/bitkub/*' \
              'test/hummingbot/connector/exchange/bitkub/*'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: flake8
        run: pre-commit run flake8 --files ${{ steps.files.outputs.list }}

      - name: isort
        run: pre-commit run isort --files ${{ steps.files.outputs.list }}
